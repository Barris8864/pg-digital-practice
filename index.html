<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>1–9 不重复数字 · 算式练习器</title>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#1f2933;
      --muted:#7b8794;
      --line:#dfe5eb;
      --accent:#10a79d;
      --accent-soft:#e7f7f5;
      --danger:#b42318;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
    body{overflow:hidden}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{
      width:min(100%,480px);
      height:100dvh;
      margin:0 auto;
      padding:
        max(10px,env(safe-area-inset-top))
        12px
        max(10px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:9px;
      overflow:hidden;
    }
    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:2px 2px 0;
      flex:0 0 auto;
    }
    h1{
      font-size:20px;
      line-height:1.2;
      margin:0;
      font-weight:750;
      letter-spacing:-0.02em;
    }
    .sub{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .badge{
      flex:none;
      font-size:11px;
      color:var(--accent);
      background:var(--accent-soft);
      padding:5px 8px;
      border-radius:999px;
      white-space:nowrap;
      font-weight:650;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:10px;
      flex:0 0 auto;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin:0 2px 8px;
    }
    .section-title{
      font-size:13px;
      font-weight:700;
      color:#5f6f7f;
    }
    .section-meta{
      font-size:11px;
      color:var(--muted);
    }
    .type-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px;
    }
    .type-btn{
      height:42px;
      min-width:0;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:var(--text);
      font-size:15px;
      font-weight:650;
      cursor:pointer;
      transition:.15s ease;
      white-space:nowrap;
    }
    .type-btn[aria-pressed="true"]{
      color:#087f78;
      border-color:var(--accent);
      background:var(--accent-soft);
      box-shadow:inset 0 0 0 1px var(--accent);
    }
    .type-btn:active{transform:scale(.985)}
    .type-btn:focus-visible,
    .action-btn:focus-visible,
    input:focus-visible{
      outline:3px solid rgba(16,167,157,.22);
      outline-offset:2px;
    }
    .input-panel{padding:10px}
    .input-row{
      display:grid;
      grid-template-columns:1fr 112px;
      gap:8px;
      align-items:end;
    }
    label{
      display:block;
      font-size:12px;
      color:#5f6f7f;
      font-weight:700;
      margin:0 0 6px 2px;
    }
    input{
      width:100%;
      height:48px;
      border:1px solid var(--line);
      border-radius:13px;
      padding:0 14px;
      background:#fff;
      color:var(--text);
      font-size:20px;
      font-weight:650;
      appearance:textfield;
    }
    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button{appearance:none;margin:0}
    .generate{
      height:48px;
      border:0;
      border-radius:13px;
      background:var(--accent);
      color:#fff;
      font-size:16px;
      font-weight:750;
      cursor:pointer;
    }
    .generate:active{transform:scale(.985)}
    .error{
      min-height:15px;
      margin:5px 2px 0;
      color:var(--danger);
      font-size:11px;
    }
    .result-panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
      min-height:0;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .result-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }
    #count strong{color:var(--accent);font-size:15px}
    .formula{
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8px 6px;
      border-radius:14px;
      background:#fafbfc;
      font-size:clamp(22px,7vw,30px);
      line-height:1.2;
      font-weight:760;
      letter-spacing:.01em;
      user-select:none;
    }
    .formula.empty{
      font-size:18px;
      color:var(--muted);
      font-weight:650;
    }
    .result-actions{
      display:grid;
      grid-template-columns:1fr 1.15fr 1fr;
      gap:7px;
      margin-top:9px;
    }
    .action-btn{
      height:40px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fff;
      color:#52606d;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
    }
    .action-btn.primary{
      color:#087f78;
      border-color:#bfe9e5;
      background:var(--accent-soft);
    }
    .action-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
    }
    .tip{
      margin-top:8px;
      text-align:center;
      color:var(--muted);
      font-size:10.5px;
      line-height:1.35;
    }
    @media (min-width:430px){
      .type-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .type-btn{font-size:14px}
    }
    @media (max-height:720px){
      .app{gap:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
      h1{font-size:18px}
      .sub{font-size:11px;margin-top:2px}
      .panel{padding:8px}
      .section-head{margin-bottom:6px}
      .type-grid{gap:5px}
      .type-btn{height:36px;font-size:14px}
      .input-row{grid-template-columns:1fr 102px}
      input,.generate{height:43px}
      .formula{min-height:52px}
      .result-actions{margin-top:6px}
      .action-btn{height:36px}
      .tip{margin-top:5px}
    }
    @media (max-width:340px){
      h1{font-size:17px}
      .type-btn{font-size:13px}
      .input-row{grid-template-columns:1fr 96px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>1–9 不重复数字 · 算式练习器</h1>
        <div class="sub">选择算式 → 输入结果 → 自动列出全部去重解</div>
      </div>
      <div class="badge">手机单屏版</div>
    </header>

    <section class="panel" aria-labelledby="type-title">
      <div class="section-head">
        <div class="section-title" id="type-title">选择算式类型</div>
        <div class="section-meta" id="typeMeta">4 个数字</div>
      </div>
      <div class="type-grid" id="typeGrid">
        <button class="type-btn" type="button" data-type="sum3">□ + □ + □</button>
        <button class="type-btn" type="button" data-type="subAdd3">□ − □ + □</button>
        <button class="type-btn" type="button" data-type="sum4">□ + □ + □ + □</button>
        <button class="type-btn" type="button" data-type="sumSub4">□ + □ − □ + □</button>
        <button class="type-btn" type="button" data-type="mul2Plus1">(□ × □) + □</button>
        <button class="type-btn" type="button" data-type="mul2Minus1">(□ × □) − □</button>
        <button class="type-btn" type="button" data-type="mul2Plus2">(□ × □) + □ + □</button>
        <button class="type-btn" type="button" data-type="mul3">□ × □ × □</button>
        <button class="type-btn" type="button" data-type="mul3Plus1">(□ × □ × □) + □</button>
        <button class="type-btn" type="button" data-type="mul3Minus1">(□ × □ × □) − □</button>
      </div>
    </section>

    <form class="panel input-panel" id="calcForm" novalidate>
      <div class="input-row">
        <div>
          <label for="target">期望结果</label>
          <input id="target" type="number" inputmode="numeric" min="-1000" max="1000" step="1" value="124" autocomplete="off" />
        </div>
        <button class="generate" type="submit">生成算式</button>
      </div>
      <div class="error" id="error" role="alert"></div>
    </form>

    <section class="result-panel" aria-live="polite" aria-atomic="true">
      <div class="result-head">
        <div id="count">找到 <strong>0</strong> 个解</div>
        <div id="indexLabel">0 / 0</div>
      </div>
      <div class="formula" id="formula">正在计算…</div>
      <div class="result-actions">
        <button class="action-btn" type="button" id="prevBtn">上一个</button>
        <button class="action-btn primary" type="button" id="randomBtn">随机一个</button>
        <button class="action-btn" type="button" id="nextBtn">下一个</button>
      </div>
      <div class="tip">数字只取 1–9 且互不重复；乘法、加法交换位置产生的重复写法会自动合并。结果卡可左右滑动切换。</div>
    </section>
  </main>

  <script>
  (() => {
    const root = document;
    const buttons = [...root.querySelectorAll('.type-btn')];
    const form = root.getElementById('calcForm');
    const targetInput = root.getElementById('target');
    const formulaEl = root.getElementById('formula');
    const countEl = root.getElementById('count');
    const indexEl = root.getElementById('indexLabel');
    const metaEl = root.getElementById('typeMeta');
    const errorEl = root.getElementById('error');
    const prevBtn = root.getElementById('prevBtn');
    const nextBtn = root.getElementById('nextBtn');
    const randomBtn = root.getElementById('randomBtn');

    let selectedType = 'mul3Plus1';
    let solutions = [];
    let currentIndex = 0;

    const configs = {
      sum3: {
        n: 3,
        normalize: ([a,b,c]) => {
          const s = [a,b,c].sort((x,y)=>x-y);
          return { key: s.join('+'), text: `${s[0]} + ${s[1]} + ${s[2]}`, value: s[0]+s[1]+s[2] };
        }
      },
      subAdd3: {
        n: 3,
        normalize: ([a,b,c]) => {
          const p = [a,c].sort((x,y)=>x-y);
          return { key: `${p[0]}+${p[1]}-${b}`, text: `${p[0]} − ${b} + ${p[1]}`, value: p[0]-b+p[1] };
        }
      },
      sum4: {
        n: 4,
        normalize: ([a,b,c,d]) => {
          const s = [a,b,c,d].sort((x,y)=>x-y);
          return { key: s.join('+'), text: s.join(' + '), value: s.reduce((m,n)=>m+n,0) };
        }
      },
      sumSub4: {
        n: 4,
        normalize: ([a,b,c,d]) => {
          const p = [a,b,d].sort((x,y)=>x-y);
          return { key: `${p.join('+')}-${c}`, text: `${p[0]} + ${p[1]} − ${c} + ${p[2]}`, value: p[0]+p[1]-c+p[2] };
        }
      },
      mul2Plus1: {
        n: 3,
        normalize: ([a,b,c]) => {
          const m = [a,b].sort((x,y)=>x-y);
          return { key: `${m.join('*')}+${c}`, text: `(${m[0]} × ${m[1]}) + ${c}`, value: m[0]*m[1]+c };
        }
      },
      mul2Minus1: {
        n: 3,
        normalize: ([a,b,c]) => {
          const m = [a,b].sort((x,y)=>x-y);
          return { key: `${m.join('*')}-${c}`, text: `(${m[0]} × ${m[1]}) − ${c}`, value: m[0]*m[1]-c };
        }
      },
      mul2Plus2: {
        n: 4,
        normalize: ([a,b,c,d]) => {
          const m = [a,b].sort((x,y)=>x-y);
          const p = [c,d].sort((x,y)=>x-y);
          return { key: `${m.join('*')}+${p.join('+')}`, text: `(${m[0]} × ${m[1]}) + ${p[0]} + ${p[1]}`, value: m[0]*m[1]+p[0]+p[1] };
        }
      },
      mul3: {
        n: 3,
        normalize: ([a,b,c]) => {
          const m = [a,b,c].sort((x,y)=>x-y);
          return { key: m.join('*'), text: m.join(' × '), value: m[0]*m[1]*m[2] };
        }
      },
      mul3Plus1: {
        n: 4,
        normalize: ([a,b,c,d]) => {
          const m = [a,b,c].sort((x,y)=>x-y);
          return { key: `${m.join('*')}+${d}`, text: `(${m[0]} × ${m[1]} × ${m[2]}) + ${d}`, value: m[0]*m[1]*m[2]+d };
        }
      },
      mul3Minus1: {
        n: 4,
        normalize: ([a,b,c,d]) => {
          const m = [a,b,c].sort((x,y)=>x-y);
          return { key: `${m.join('*')}-${d}`, text: `(${m[0]} × ${m[1]} × ${m[2]}) − ${d}`, value: m[0]*m[1]*m[2]-d };
        }
      }
    };

    function permutations(n) {
      const out = [];
      const used = Array(10).fill(false);
      const cur = [];
      function walk() {
        if (cur.length === n) {
          out.push(cur.slice());
          return;
        }
        for (let d = 1; d <= 9; d++) {
          if (used[d]) continue;
          used[d] = true;
          cur.push(d);
          walk();
          cur.pop();
          used[d] = false;
        }
      }
      walk();
      return out;
    }

    const permutationCache = {
      3: permutations(3),
      4: permutations(4)
    };

    function getTarget() {
      const raw = targetInput.value.trim();
      if (raw === '') {
        errorEl.textContent = '请输入一个整数结果。';
        return null;
      }
      const value = Number(raw);
      if (!Number.isInteger(value)) {
        errorEl.textContent = '结果需要是整数。';
        return null;
      }
      if (value < -1000 || value > 1000) {
        errorEl.textContent = '请输入 −1000 到 1000 之间的整数。';
        return null;
      }
      errorEl.textContent = '';
      return value;
    }

    function generate() {
      const target = getTarget();
      if (target === null) return;

      const config = configs[selectedType];
      const seen = new Map();

      for (const p of permutationCache[config.n]) {
        const item = config.normalize(p);
        if (item.value === target && !seen.has(item.key)) {
          seen.set(item.key, item);
        }
      }

      solutions = [...seen.values()].sort((a,b) => a.text.localeCompare(b.text, 'zh-CN', {numeric:true}));
      currentIndex = 0;
      render(target);
    }

    function render(target = getTarget()) {
      const count = solutions.length;
      countEl.innerHTML = `找到 <strong>${count}</strong> 个解`;
      indexEl.textContent = count ? `${currentIndex + 1} / ${count}` : '0 / 0';

      if (!count) {
        formulaEl.textContent = '暂无解，换个结果试试';
        formulaEl.classList.add('empty');
      } else {
        formulaEl.textContent = `${solutions[currentIndex].text} = ${target}`;
        formulaEl.classList.remove('empty');
      }

      const disabled = count <= 1;
      prevBtn.disabled = disabled;
      nextBtn.disabled = disabled;
      randomBtn.disabled = disabled;
    }

    function cycle(delta) {
      if (solutions.length <= 1) return;
      currentIndex = (currentIndex + delta + solutions.length) % solutions.length;
      render(Number(targetInput.value));
    }

    buttons.forEach(btn => {
      const active = btn.dataset.type === selectedType;
      btn.setAttribute('aria-pressed', String(active));
      btn.addEventListener('click', () => {
        selectedType = btn.dataset.type;
        buttons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
        metaEl.textContent = `${configs[selectedType].n} 个数字`;
        generate();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      generate();
      targetInput.blur();
    });

    prevBtn.addEventListener('click', () => cycle(-1));
    nextBtn.addEventListener('click', () => cycle(1));
    randomBtn.addEventListener('click', () => {
      if (solutions.length <= 1) return;
      let next = currentIndex;
      while (next === currentIndex) {
        next = Math.floor(Math.random() * solutions.length);
      }
      currentIndex = next;
      render(Number(targetInput.value));
    });

    let startX = null;
    formulaEl.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].clientX;
    }, {passive:true});
    formulaEl.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) < 40) return;
      cycle(dx < 0 ? 1 : -1);
    }, {passive:true});

    selectedType = 'mul3Plus1';
    metaEl.textContent = '4 个数字';
    generate();
  })();
  </script>
</body>
</html>
